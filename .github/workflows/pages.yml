# Publica os protótipos no GitHub Pages a cada push na main.
#
# Antes de servir para alguma coisa, dois passos manuais no repositório:
#   1. Settings > Pages > Source: GitHub Actions
#   2. trocar NUXT_APP_BASE_URL abaixo pelo nome real do repositório
#
# Atenção: Pages em repositório PRIVADO exige plano pago. Se o repositório for privado e o
# plano for gratuito, a publicação sai pela Vercel — veja a Parte 3 de AGENTE_PROTOTIPOS.md.
name: Publicar protótipos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm generate
        env:
          NUXT_APP_BASE_URL: /enspace-prototipos/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

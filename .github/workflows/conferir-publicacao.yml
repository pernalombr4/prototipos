# Rede de segurança da publicação: confere a cada 30 minutos se o site no ar é a ponta da main.
#
# Por que existe: em 2026-11-11, num incidente do GitHub (Webhooks e Actions, 20:22 a 20:48 UTC),
# 5 execuções do "Publicar protótipos" nasceram como "queued" e nunca rodaram. A API não as cancela
# ("has not been queued yet"). Se nenhum push vier depois, o protótipo fica velho no ar sem aviso.
#
# O que faz:
#   1. lê o commit da última publicação com sucesso no ambiente github-pages;
#   2. se é a ponta da main, termina;
#   3. se há publicação andando (em execução, ou na fila há menos de 20 minutos), espera a próxima
#      conferência; execução "queued" mais velha que isso é tratada como fantasma e não conta;
#   4. senão, dispara o "Publicar protótipos" na main e deixa um aviso na execução.
#
# O GITHUB_TOKEN pode disparar workflow_dispatch (é a exceção à regra de não encadear workflows).
name: Conferir publicação

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  deployments: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - name: Site no ar é a ponta da main?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          main=$(gh api "repos/$REPO/commits/main" -q .sha)

          no_ar=""
          for id in $(gh api "repos/$REPO/deployments?environment=github-pages&per_page=20" -q '.[].id'); do
            estado=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" -q '.[0].state')
            if [ "$estado" = "success" ]; then
              no_ar=$(gh api "repos/$REPO/deployments/$id" -q .sha)
              break
            fi
          done

          echo "main:  $main"
          echo "no ar: ${no_ar:-nenhuma publicação com sucesso}"
          if [ "$main" = "$no_ar" ]; then
            echo "Site em dia."
            exit 0
          fi

          andando=$(gh run list -R "$REPO" --workflow pages.yml --limit 20 --json status,createdAt \
            -q '[.[] | select(.status == "in_progress" or ((.status == "queued" or .status == "waiting" or .status == "pending") and ((now - (.createdAt | fromdateiso8601)) < 1200)))] | length')
          if [ "$andando" != "0" ]; then
            echo "Há $andando publicação(ões) andando. A próxima conferência olha de novo."
            exit 0
          fi

          echo "::warning::Site atrás da main (no ar ${no_ar:0:7}, main ${main:0:7}). Disparando o Publicar protótipos."
          gh workflow run pages.yml -R "$REPO" --ref main
